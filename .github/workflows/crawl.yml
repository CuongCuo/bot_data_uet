name: Crawl Scholarship Bot

on:
  schedule:
    - cron: "0 23 * * *"   # Run daily at 23:00 UTC (6:00 AM Vietnam time)
  workflow_dispatch: {}      # Allow manual triggering from GitHub UI

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push database updates back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run Crawler
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      - name: Commit and Push Database updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add db/seen_urls.txt
          # Only commit and push if there are changes in seen_urls.txt
          if ! git diff --quiet db/seen_urls.txt; then
            git commit -m "bot: auto-update seen items database [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi
